    <!-- Safe Window.fetch setter patch to prevent Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter -->
    <script>
      (function() {
        try {
          var win = typeof window !== 'undefined' ? window : globalThis;
          var proto = Object.getPrototypeOf(win) || win;
          var desc = Object.getOwnPropertyDescriptor(proto, 'fetch') || Object.getOwnPropertyDescriptor(win, 'fetch');
          if (desc && desc.get && !desc.set) {
            var currentFetch = desc.get.call(win);
            Object.defineProperty(win, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
